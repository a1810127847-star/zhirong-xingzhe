collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Training does not launch Nav2's local costmap. A 0.26 m circular
    # footprint matches the robot_radius used by the stable DWB baseline.
    polygons:
      - FootprintApproach
    FootprintApproach:
      type: circle
      radius: 0.26
      action_type: approach
      time_before_collision: 1.2
      simulation_time_step: 0.05
      max_points: 3
      visualize: true
      polygon_pub_topic: /safety/predicted_footprint
      enabled: true

    observation_sources:
      - scan
    scan:
      type: scan
      topic: /scan
      enabled: true
